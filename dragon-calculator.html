<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DAW Pitch Calculator (440Hz)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e24;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a32;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
        }
        h2 { text-align: center; color: #4caf50; margin-top: 0; }
        .block { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        input {
            width: 93%;
            padding: 10px;
            background: #151518;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
        }
        input:focus { border-color: #4caf50; outline: none; }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #1f3a22;
            border-left: 5px solid #4caf50;
            border-radius: 3px;
            font-weight: bold;
        }
        hr { border: 0; border-top: 1px solid #444; margin: 20px 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Pitch Calc (440 Hz)</h2>
    
    <div class="block">
        <label>Введи Герцы (Hz):</label>
        <input type="number" id="hzInput" placeholder="Например: 432" oninput="hzToCents()">
        <div id="centsResult" class="result">Центы: 0</div>
    </div>

    <hr>

    <div class="block">
        <label>Введи Центы (Cents):</label>
        <input type="number" id="centsInput" placeholder="Например: -32" oninput="centsToHz()">
        <div id="hzResult" class="result">Частота: 440 Гц</div>
    </div>
</div>

<script>
function hzToCents() {
    let hz = parseFloat(document.getElementById('hzInput').value);
    if (!hz || hz <= 0) {
        document.getElementById('centsResult').innerText = "Центы: 0";
        return;
    }
    // Формула: 1200 * log2(f2/f1)
    let cents = 1200 * Math.log2(hz / 440);
    let sign = cents > 0 ? "+" : "";
    document.getElementById('centsResult').innerText = `Центы: ${sign}${Math.round(cents)} (точно: ${cents.toFixed(2)})`;
}

function centsToHz() {
    let cents = parseFloat(document.getElementById('centsInput').value);
    if (isNaN(cents)) {
        document.getElementById('hzResult').innerText = "Частота: 440 Гц";
        return;
    }
    // Формула: 440 * 2^(с/1200)
    let hz = 440 * Math.pow(2, cents / 1200);
    document.getElementById('hzResult').innerText = `Частота: ${Math.round(hz)} Гц (точно: ${hz.toFixed(2)})`;
}
</script>

</body>
</html>
