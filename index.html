<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои инструменты</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .card {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        a {
            text-decoration: none;
            color: #0066cc;
            font-weight: 600;
            font-size: 18px;
            display: block;
        }
        a:hover {
            color: #004999;
        }
        .desc {
            color: #555;
            font-size: 14px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <h1>Мои мини-инструменты</h1>
    <p class="subtitle">Коллекция полезных утилит и генераторов.</p>

    <div class="card">
        <a href="./weekly-report-generator.html">Генератор еженедельных отчетов</a>
        <div class="desc">Инструмент для быстрой и удобной подготовки рабочих отчетов.</div>
    </div>

    <div class="card">
        <a href="./dragon-calculator.html">Калькулятор для Драгона</a>
        <div class="desc">Перевод герц в центы и обратно относительно строя 440 Гц. Удобно для настройки питча в DAW.</div>
    </div>

    <!-- Когда появится следующий инструмент, просто скопируйте блок .card ниже и измените ссылки -->

</body>
</html>
